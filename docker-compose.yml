# Local development stack:   docker compose up --build
#
# Services:
#   postgres  - the database (persistent volume)
#   redis     - summary / idempotency cache (ephemeral, LRU-bounded)
#   kafka     - import dispatch (KRaft single node, no ZooKeeper)
#   api       - HTTP API only (PROCESSING_ENABLED=false): never does CPU-heavy work
#   worker    - consumes import events and processes files; scale with `--scale worker=2`
#
# The API and worker share the uploads volume so a file uploaded through the API is
# readable by whichever worker claims the job. Across hosts the FileStorage port would
# be backed by object storage instead (see ADR-004).
#
# Host access: API on :8080, worker probes/metrics on :8081, Postgres :5432,
# Redis :6379, Kafka :29092 (EXTERNAL listener; containers use kafka:9092).

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: reconciliation
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    command: >
      postgres -c max_connections=100
               -c shared_buffers=256MB
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d reconciliation"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    # Cache only: nothing here needs to survive a restart, so no persistence and a hard
    # memory ceiling with LRU eviction rather than unbounded growth.
    command: ["redis-server", "--maxmemory", "128mb", "--maxmemory-policy", "allkeys-lru", "--save", ""]
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  kafka:
    image: apache/kafka:3.9.1
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093,EXTERNAL://:29092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,EXTERNAL://localhost:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 8
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      KAFKA_HEAP_OPTS: "-Xms256m -Xmx512m"
    ports:
      - "29092:29092"
    volumes:
      - kafkadata:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 > /dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 20s
    restart: unless-stopped

  api:
    build: .
    image: transaction-reconciliation-service:local
    environment:
      DATABASE_URL: jdbc:postgresql://postgres:5432/reconciliation
      DATABASE_USERNAME: postgres
      DATABASE_PASSWORD: postgres
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      REDIS_HOST: redis
      PROCESSING_ENABLED: "false"
      STORAGE_ROOT: /data/uploads
      UPLOAD_MAX_CONCURRENT: "4"
      DB_POOL_SIZE: "8"
      SPRING_PROFILES_ACTIVE: json
    ports:
      - "8080:8080"
    volumes:
      - uploads:/data/uploads
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      kafka: { condition: service_healthy }
    # Grace period must exceed the application's own shutdown grace period.
    stop_grace_period: 45s
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 768M

  worker:
    build: .
    image: transaction-reconciliation-service:local
    environment:
      DATABASE_URL: jdbc:postgresql://postgres:5432/reconciliation
      DATABASE_USERNAME: postgres
      DATABASE_PASSWORD: postgres
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      REDIS_HOST: redis
      PROCESSING_ENABLED: "true"
      PROCESSING_MAX_CONCURRENT_IMPORTS: "2"
      PROCESSING_BATCH_SIZE: "1000"
      PROCESSING_MAX_IN_FLIGHT_BATCHES: "2"
      RISK_WORKER_THREADS: "0"
      STORAGE_ROOT: /data/uploads
      DB_POOL_SIZE: "8"
      SPRING_PROFILES_ACTIVE: json
      PORT: "8081"
    # The worker still exposes /health and /metrics on 8081 for scraping.
    ports:
      - "8081:8081"
    volumes:
      - uploads:/data/uploads
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      kafka: { condition: service_healthy }
    stop_grace_period: 45s
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 1024M

volumes:
  pgdata:
  kafkadata:
  uploads:
