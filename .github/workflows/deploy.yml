name: Build and Deploy

on:
  push:
    branches:
      - main
  # Run by hand from the Actions tab (first deploy, or a redeploy without a new commit).
  workflow_dispatch:

# One deploy at a time; a newer push waits for the running deploy instead of racing it.
concurrency:
  group: deploy-production
  cancel-in-progress: false

env:
  # Image lives in GitHub Container Registry, authenticated with the workflow's own
  # GITHUB_TOKEN, so there is no personal access token to expire.
  REGISTRY_IMAGE: ghcr.io/${{ github.repository }}
  # Image name deploy/docker-compose.prod.yml runs (api and worker, pull_policy: never).
  # The image pulled from GHCR is retagged to this on the droplet, so compose starts the
  # build this run produced. Changing it here means changing it there too.
  DEPLOY_IMAGE: habtamuwgs/transaction-reconciliation-service
  # Where this repo is checked out on the droplet (deploy/README.md). Override with an
  # Actions variable (Settings -> Secrets and variables -> Actions -> Variables).
  DEPLOY_DIR: ${{ vars.DEPLOY_DIR || '/opt/reconciliation' }}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          # GHCR authorizes on the token; the username is only an identity label. Use
          # repository_owner so it matches the image namespace whoever pushed.
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # The Dockerfile runs the Maven build itself (multi-stage), so no JDK is needed on
      # the runner. Runners are linux/amd64, like the droplet.
      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY_IMAGE }}:latest
            ${{ env.REGISTRY_IMAGE }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # Split from `build` so the credential handed to the droplet is read-only: job-level
  # permissions scope GITHUB_TOKEN, and this job never needs to push.
  deploy:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: read
      packages: read

    # GitHub repo secrets (Settings -> Secrets and variables -> Actions):
    #   DO_HOST, DO_SSH_USER, DO_SSH_KEY: droplet access
    # Application configuration and secrets stay in deploy/.env on the droplet
    # (deploy/README.md); this workflow does not pass any.
    steps:
      - name: Deploy on DigitalOcean droplet
        uses: appleboy/ssh-action@v1.2.0
        env:
          # Short-lived, repo-scoped, read-only. Expires when this job ends.
          GHCR_USER: ${{ github.repository_owner }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REGISTRY_IMAGE: ${{ env.REGISTRY_IMAGE }}
          DEPLOY_IMAGE: ${{ env.DEPLOY_IMAGE }}
          DEPLOY_DIR: ${{ env.DEPLOY_DIR }}
          SHA: ${{ github.sha }}
        with:
          host: ${{ secrets.DO_HOST }}
          username: ${{ secrets.DO_SSH_USER }}
          key: ${{ secrets.DO_SSH_KEY }}
          envs: GHCR_USER,GHCR_TOKEN,REGISTRY_IMAGE,DEPLOY_IMAGE,DEPLOY_DIR,SHA
          script: |
            set -euo pipefail
            cd "$DEPLOY_DIR"

            # The stack definition is versioned in this repo, so pull it before using it;
            # otherwise a compose or Caddyfile change merged here never reaches the droplet.
            git pull --ff-only
            COMPOSE="docker compose -f deploy/docker-compose.prod.yml"

            echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USER" --password-stdin
            trap 'docker logout ghcr.io >/dev/null 2>&1 || true' EXIT

            # Preserve the image currently serving traffic before promoting the new one.
            docker tag "$DEPLOY_IMAGE:latest" "$DEPLOY_IMAGE:rollback-$SHA" 2>/dev/null || true

            docker pull "$REGISTRY_IMAGE:$SHA"
            docker tag "$REGISTRY_IMAGE:$SHA" "$DEPLOY_IMAGE:latest"

            # api and worker run the same image; depends_on starts postgres, redis and kafka
            # (healthy) first. caddy is included so a first deploy starts it, and so a changed
            # DOMAIN in deploy/.env recreates it. Flyway migrates when the api starts.
            # A restarted worker shuts down gracefully: in-flight batches commit, its import is
            # released, and the new worker resumes from the checkpoint.
            $COMPOSE up -d api worker caddy

            # The Caddyfile is bind-mounted, and compose does not recreate a container when a
            # mounted file's content changes. Graceful reload: zero downtime, no-op if unchanged.
            $COMPOSE exec -T caddy caddy reload --config /etc/caddy/Caddyfile 2>/dev/null \
              || echo "::warning::caddy reload skipped (caddy not running?)"

            # Health gate on the readiness probes (database, storage, Kafka, worker state). A bad
            # migration or a failed dependency surfaces here as a container that never becomes
            # ready. On timeout, roll back both roles to the image that was serving before and
            # fail the job so the deploy goes red.
            ready() {
              # busybox wget exits 0 only on a 2xx response.
              $COMPOSE exec -T "$1" wget -q -O /dev/null "http://127.0.0.1:$2/health/ready"
            }
            echo "Waiting for api and worker to become ready..."
            healthy=false
            for i in $(seq 1 36); do
              if ready api 8080 && ready worker 8081; then
                healthy=true; break
              fi
              sleep 5
            done

            if [ "$healthy" != "true" ]; then
              echo "::error::api/worker did not become ready within 180s; rolling back."
              $COMPOSE logs --tail 60 api worker || true
              docker tag "$DEPLOY_IMAGE:rollback-$SHA" "$DEPLOY_IMAGE:latest" 2>/dev/null \
                && $COMPOSE up -d api worker \
                && echo "Rolled back to the previous image." \
                || echo "::warning::No previous image to roll back to."
              exit 1
            fi
            echo "api and worker are ready."

            # Remove the rollback tag of this deploy and dangling layers; keep the running image.
            docker rmi "$DEPLOY_IMAGE:rollback-$SHA" >/dev/null 2>&1 || true
            docker image prune -f
