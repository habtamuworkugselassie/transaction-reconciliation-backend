name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    # Integration tests (*IT) run against this Postgres instead of starting a
    # Testcontainers one: PostgresSupport picks up TEST_DATABASE_URL. The schema is
    # dropped and re-migrated by the tests, so this must never be a real database.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: reconciliation_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d reconciliation_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Unit and integration tests
        env:
          TEST_DATABASE_URL: jdbc:postgresql://localhost:5432/reconciliation_test
          TEST_DATABASE_USERNAME: postgres
          TEST_DATABASE_PASSWORD: postgres
        run: ./mvnw -B -ntp -Pintegration verify

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            target/surefire-reports/
            target/failsafe-reports/
          retention-days: 7
