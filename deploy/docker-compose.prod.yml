# Production stack for a single DigitalOcean droplet.
#
# The app image is not built by compose. Build it from the repo checkout on the
# droplet first, then start the stack (see deploy/README.md):
#
#   docker build -t habtamuwgs/transaction-reconciliation-service:latest .
#   docker compose -f deploy/docker-compose.prod.yml up -d
#
# Kafka carries real traffic here: the worker consumes import events from it. It runs
# in KRaft mode (no ZooKeeper) with a 512 MB
# heap, which keeps the whole stack inside a 4 GB droplet:
#   postgres ~400 MB, kafka ~700 MB, redis 64 MB, api ~600 MB, worker ~900 MB, caddy ~30 MB.

name: reconciliation

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-reconciliation}
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    command: >
      postgres -c max_connections=60
               -c shared_buffers=192MB
               -c effective_cache_size=512MB
               -c work_mem=16MB
    volumes:
      # A host directory, not a named volume - see "Data on the host" below.
      - ${DATA_DIR:-/var/lib/reconciliation}/postgres:/var/lib/postgresql/data
    # No ports: published. The database is reachable only on the compose network.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-reconciliation}"]
      interval: 10s
      timeout: 5s
      retries: 10
    mem_limit: 512m
    networks: [internal]

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    # Caching only - nothing here needs to survive a restart, so no volume and a hard
    # memory ceiling with LRU eviction rather than unbounded growth.
    command: ["redis-server", "--maxmemory", "64mb", "--maxmemory-policy", "allkeys-lru", "--save", ""]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
    mem_limit: 96m
    networks: [internal]

  # One-shot, runs before kafka, api and worker on every `up`. Docker creates a missing
  # bind-mount directory as root, but Kafka (appuser) and the app (app) run as uid 1000
  # and could not write to it: Kafka crash-looped on AccessDeniedException. This creates
  # the directories and gives them to uid 1000. The recursive chown runs only when the
  # owner is wrong, so it costs nothing on later deploys. Postgres is not included: its
  # entrypoint fixes ownership of its own data directory.
  data-dirs:
    image: busybox:1.36.1
    user: "0:0"
    restart: "no"
    command:
      - sh
      - -c
      - |
        set -e
        for d in /data/kafka /data/uploads; do
          mkdir -p "$$d"
          [ "$$(stat -c %u:%g "$$d")" = "1000:1000" ] || chown -R 1000:1000 "$$d"
        done
        echo "data directories ready"
    volumes:
      - ${DATA_DIR:-/var/lib/reconciliation}:/data
    networks: [internal]

  kafka:
    image: apache/kafka:3.9.1
    restart: unless-stopped
    depends_on:
      data-dirs: { condition: service_completed_successfully }
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_NUM_PARTITIONS: ${KAFKA_IMPORTS_PARTITIONS:-8}
      KAFKA_LOG_RETENTION_HOURS: 72
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      KAFKA_HEAP_OPTS: "-Xms256m -Xmx512m"
    volumes:
      - ${DATA_DIR:-/var/lib/reconciliation}/kafka:/var/lib/kafka/data
    # No ports: published. Only the api and worker talk to it.
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 > /dev/null 2>&1"]
      interval: 15s
      timeout: 10s
      retries: 12
      start_period: 30s
    mem_limit: 768m
    networks: [internal]

  api:
    # Built locally on the droplet with `docker build -t <this tag> .`.
    image: habtamuwgs/transaction-reconciliation-service:latest
    # Never reach for a registry: this tag only exists locally. Without this, a missing
    # tag sends compose to Docker Hub for a repository that is not there, and the error
    # names the wrong problem.
    pull_policy: never
    restart: unless-stopped
    depends_on:
      data-dirs: { condition: service_completed_successfully }
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      kafka: { condition: service_healthy }
    env_file: [.env]
    environment:
      SPRING_PROFILES_ACTIVE: json
      DATABASE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-reconciliation}
      DATABASE_USERNAME: ${POSTGRES_USER}
      DATABASE_PASSWORD: ${POSTGRES_PASSWORD}
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      REDIS_HOST: redis
      PROCESSING_ENABLED: "false"
      STORAGE_ROOT: /data/uploads
      UPLOAD_MAX_CONCURRENT: ${UPLOAD_MAX_CONCURRENT:-4}
      UPLOAD_MAX_FILE_SIZE_BYTES: ${UPLOAD_MAX_FILE_SIZE_BYTES:-209715200}
      DB_POOL_SIZE: "6"
      # Without a ceiling the JVM takes a quarter of the host's RAM, which on a 4 GB
      # droplet starves Postgres and Kafka during an import.
      JAVA_TOOL_OPTIONS: -XX:MaxRAMPercentage=60 -XX:InitialRAMPercentage=25 -XX:+ExitOnOutOfMemoryError
    volumes:
      - ${DATA_DIR:-/var/lib/reconciliation}/uploads:/data/uploads
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/health/live > /dev/null || exit 1"]
      interval: 20s
      timeout: 5s
      retries: 15
      start_period: 90s
    stop_grace_period: 45s
    mem_limit: 768m
    networks: [internal]

  worker:
    image: habtamuwgs/transaction-reconciliation-service:latest
    pull_policy: never
    restart: unless-stopped
    depends_on:
      data-dirs: { condition: service_completed_successfully }
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      kafka: { condition: service_healthy }
    env_file: [.env]
    environment:
      SPRING_PROFILES_ACTIVE: json
      DATABASE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-reconciliation}
      DATABASE_USERNAME: ${POSTGRES_USER}
      DATABASE_PASSWORD: ${POSTGRES_PASSWORD}
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      REDIS_HOST: redis
      PROCESSING_ENABLED: "true"
      PROCESSING_MAX_CONCURRENT_IMPORTS: ${PROCESSING_MAX_CONCURRENT_IMPORTS:-1}
      PROCESSING_BATCH_SIZE: ${PROCESSING_BATCH_SIZE:-1000}
      PROCESSING_MAX_IN_FLIGHT_BATCHES: ${PROCESSING_MAX_IN_FLIGHT_BATCHES:-2}
      RISK_WORKER_THREADS: ${RISK_WORKER_THREADS:-0}
      STORAGE_ROOT: /data/uploads
      DB_POOL_SIZE: "6"
      PORT: "8081"
      JAVA_TOOL_OPTIONS: -XX:MaxRAMPercentage=60 -XX:InitialRAMPercentage=25 -XX:+ExitOnOutOfMemoryError
    volumes:
      - ${DATA_DIR:-/var/lib/reconciliation}/uploads:/data/uploads
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8081/health/live > /dev/null || exit 1"]
      interval: 20s
      timeout: 5s
      retries: 15
      start_period: 90s
    # Must exceed the application's shutdown grace period so in-flight batches commit
    # and the job is released cleanly before Docker kills the process.
    stop_grace_period: 60s
    mem_limit: 1024m
    networks: [internal]

  caddy:
    # Reverse proxy and the only published ports. With a hostname in DOMAIN it obtains
    # and renews a Let's Encrypt certificate (the name must resolve to this droplet
    # before the first start); with DOMAIN=http://<ip> it serves plain HTTP.
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on: [api]
    environment:
      DOMAIN: ${DOMAIN:?set DOMAIN in .env}
      ACME_EMAIL: ${ACME_EMAIL:?set ACME_EMAIL in .env}
    # Host ports. 80 and 443 are taken on the droplet by another service, so the defaults
    # are 9001 (HTTP) and 9443 (HTTPS); Caddy itself still listens on 80/443 inside the
    # container. A hostname DOMAIN with a Let's Encrypt certificate needs the real 80/443
    # (the ACME challenge comes in on 80): set HTTP_PORT=80 and HTTPS_PORT=443 in deploy/.env.
    ports:
      - "${HTTP_PORT:-9001}:80"
      - "${HTTPS_PORT:-9443}:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    mem_limit: 128m
    networks: [internal]

# Data on the host
#
# Postgres data, Kafka logs and uploaded files are bind mounts under DATA_DIR (default
# /var/lib/reconciliation), deliberately NOT named volumes: `compose down -v`,
# `volume prune` and a renamed project cannot remove them. Caddy's certificates stay
# in named volumes; losing them costs a re-issue, nothing more.
volumes:
  caddy-data:
  caddy-config:

networks:
  internal:
