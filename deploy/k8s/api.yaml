# API role: HTTP only (PROCESSING_ENABLED=false). Stateless, so it scales horizontally;
# per-instance limits (UPLOAD_MAX_CONCURRENT, EVENTS_MAX_CONNECTIONS) multiply by replicas.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: reconciliation-api
  labels: { app.kubernetes.io/name: reconciliation-api, app.kubernetes.io/component: api }
spec:
  replicas: 2
  selector:
    matchLabels: { app.kubernetes.io/name: reconciliation-api }
  strategy:
    type: RollingUpdate
    rollingUpdate: { maxUnavailable: 0, maxSurge: 1 }
  template:
    metadata:
      labels: { app.kubernetes.io/name: reconciliation-api, app.kubernetes.io/component: api }
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8080"
        prometheus.io/path: /metrics
    spec:
      # SIGTERM -> preStop (5 s) -> readiness DOWN, Tomcat drains, streams close ->
      # SHUTDOWN_GRACE_PERIOD (30 s). The pod gets 60 s before SIGKILL.
      terminationGracePeriodSeconds: 60
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: api
          image: transaction-reconciliation-service
          imagePullPolicy: IfNotPresent
          ports:
            - { name: http, containerPort: 8080 }
          envFrom:
            - configMapRef: { name: reconciliation-config }
            - secretRef: { name: reconciliation-db }
          env:
            - { name: PROCESSING_ENABLED, value: "false" }
            - { name: DB_POOL_SIZE, value: "6" }
            - { name: JAVA_TOOL_OPTIONS, value: "-XX:MaxRAMPercentage=60 -XX:InitialRAMPercentage=25 -XX:+ExitOnOutOfMemoryError" }
          resources:
            requests: { cpu: 250m, memory: 512Mi }
            limits: { memory: 768Mi }
          # Flyway runs at startup; give it time before liveness counts.
          startupProbe:
            httpGet: { path: /health/live, port: http }
            periodSeconds: 5
            failureThreshold: 36
          livenessProbe:
            httpGet: { path: /health/live, port: http }
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet: { path: /health/ready, port: http }
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 2
          lifecycle:
            # Endpoint removal propagates asynchronously; keep serving briefly so no request
            # is routed to a pod that has already stopped accepting.
            preStop:
              exec: { command: ["sh", "-c", "sleep 5"] }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: [ALL] }
          volumeMounts:
            - { name: uploads, mountPath: /data/uploads }
            - { name: tmp, mountPath: /tmp }
      volumes:
        - name: uploads
          persistentVolumeClaim: { claimName: reconciliation-uploads }
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: reconciliation-api
  labels: { app.kubernetes.io/name: reconciliation-api }
spec:
  selector: { app.kubernetes.io/name: reconciliation-api }
  ports:
    - { name: http, port: 80, targetPort: http }
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: reconciliation-api
spec:
  minAvailable: 1
  selector:
    matchLabels: { app.kubernetes.io/name: reconciliation-api }
