# Worker role: Kafka consumer + CPU scoring pool. No Service: it takes no traffic. Probes
# and /metrics are on port 8081.
#
# Scaling: total parallelism = replicas x PROCESSING_MAX_CONCURRENT_IMPORTS, capped by
# KAFKA_IMPORTS_PARTITIONS. A pod killed mid-import is safe: its lease expires and
# another worker resumes from the checkpoint.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: reconciliation-worker
  labels: { app.kubernetes.io/name: reconciliation-worker, app.kubernetes.io/component: worker }
spec:
  replicas: 2
  selector:
    matchLabels: { app.kubernetes.io/name: reconciliation-worker }
  template:
    metadata:
      labels: { app.kubernetes.io/name: reconciliation-worker, app.kubernetes.io/component: worker }
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8081"
        prometheus.io/path: /metrics
    spec:
      # SHUTDOWN_GRACE_PERIOD (30 s) for in-flight batches, then forced release, plus margin.
      # If SIGKILL comes first the lease simply expires (30 s) and the import is resumed.
      terminationGracePeriodSeconds: 60
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: worker
          image: transaction-reconciliation-service
          imagePullPolicy: IfNotPresent
          ports:
            - { name: http, containerPort: 8081 }
          envFrom:
            - configMapRef: { name: reconciliation-config }
            - secretRef: { name: reconciliation-db }
          env:
            - { name: PROCESSING_ENABLED, value: "true" }
            - { name: PORT, value: "8081" }
            - { name: PROCESSING_MAX_CONCURRENT_IMPORTS, value: "1" }
            # Size the scoring pool to the CPU request explicitly. Without a CPU limit the JVM
            # sees every core on the node and would start one scoring thread per node core.
            - { name: RISK_WORKER_THREADS, value: "2" }
            - { name: DB_POOL_SIZE, value: "6" }
            - { name: JAVA_TOOL_OPTIONS, value: "-XX:MaxRAMPercentage=60 -XX:InitialRAMPercentage=25 -XX:+ExitOnOutOfMemoryError -XX:ActiveProcessorCount=2" }
          resources:
            requests: { cpu: "2", memory: 768Mi }
            limits: { memory: 1Gi }
          startupProbe:
            httpGet: { path: /health/live, port: http }
            periodSeconds: 5
            failureThreshold: 36
          livenessProbe:
            httpGet: { path: /health/live, port: http }
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet: { path: /health/ready, port: http }
            periodSeconds: 10
            timeoutSeconds: 3
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: [ALL] }
          volumeMounts:
            - { name: uploads, mountPath: /data/uploads }
            - { name: tmp, mountPath: /tmp }
      volumes:
        - name: uploads
          persistentVolumeClaim: { claimName: reconciliation-uploads }
        - name: tmp
          emptyDir: {}
